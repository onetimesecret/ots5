<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 200">
<rect width="580" height="200" fill="#000"/>
<text x="570" y="10" font-size="7" fill="#fff" opacity=".3">#A2F0</text>
<!-- GLYPH 16×16 -->
<ellipse cx="28" cy="28" rx="5.5" ry="3.5" fill="none" stroke="#fff" stroke-width="1.3"/>
<circle cx="28" cy="28" r="1.2" fill="#fff"/>
<line x1="24" y1="24" x2="32" y2="32" stroke="#fff" stroke-width="1.8"/>
<circle cx="32" cy="32" r=".5" fill="#fff" opacity=".3"/>
<!-- LOCKUP 80px -->
<g transform="translate(70,0)">
<ellipse cx="30" cy="60" rx="13" ry="8" fill="none" stroke="#fff" stroke-width="2.2"/>
<circle cx="30" cy="60" r="2.8" fill="#fff"/>
<line x1="20" y1="50" x2="40" y2="70" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<circle cx="38" cy="68" r="1.2" fill="#fff" opacity=".4"/>
<text x="60" y="52" font-size="18" font-weight="700" fill="#fff">OneTime</text>
<text x="60" y="70" font-size="18" font-weight="300" fill="#fff">Secret</text>
</g>
<!-- BADGE 200px -->
<g transform="translate(300,0)">
<ellipse cx="130" cy="70" rx="26" ry="16" fill="none" stroke="#fff" stroke-width="3.5"/>
<circle cx="130" cy="70" r="5.5" fill="#fff"/>
<line x1="110" y1="50" x2="150" y2="90" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<circle cx="147" cy="87" r="2.5" fill="#fff" opacity=".5"/>
<circle cx="143" cy="83" r="1.8" fill="#fff" opacity=".3"/>
<text x="130" y="130" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">OneTime</text>
<text x="130" y="155" font-size="28" font-weight="300" fill="#fff" text-anchor="middle">Secret</text>
<text x="130" y="180" font-size="14" fill="#fff" text-anchor="middle" opacity=".7">One view. Then gone.</text>
</g>
<text x="5" y="195" font-size="8" fill="#fff" opacity=".4">Reduced to essence: one glance, crossed out, fading.</text>
</svg>
