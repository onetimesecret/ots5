  <circle cx="50" cy="70" r="5" fill="#000"/>
  <circle cx="50" cy="85" r="5" fill="#000"/>
  <circle cx="50" cy="100" r="5" fill="#000"/>
  <circle cx="50" cy="115" r="5" fill="#000"/>
  <circle cx="50" cy="130" r="5" fill="#000"/>

  <rect x="62" y="67" width="3" height="6" fill="#000"/>
  <rect x="62" y="82" width="3" height="6" fill="#000"/>
  <rect x="62" y="97" width="3" height="6" fill="#000"/>
  <rect x="62" y="112" width="3" height="6" fill="#000"/>
  <rect x="62" y="127" width="3" height="6" fill="#000"/>

  <!-- Middle column - degrading -->
  <circle cx="80" cy="70" r="4.5" fill="#000" opacity="0.9"/>
  <circle cx="80" cy="85" r="4.5" fill="#000" opacity="0.9"/>
  <circle cx="80" cy="100" r="4.5" fill="#000" opacity="0.9"/>
  <circle cx="80" cy="115" r="4.5" fill="#000" opacity="0.9"/>
  <circle cx="80" cy="130" r="4.5" fill="#000" opacity="0.9"/>

  <rect x="92" y="68" width="3" height="5" fill="#000" opacity="0.8"/>
  <rect x="92" y="83" width="3" height="5" fill="#000" opacity="0.8"/>
  <rect x="92" y="98" width="3" height="5" fill="#000" opacity="0.8"/>
  <rect x="92" y="113" width="3" height="5" fill="#000" opacity="0.8"/>
  <rect x="92" y="128" width="3" height="5" fill="#000" opacity="0.8"/>

  <!-- Right column - fragmenting -->
  <circle cx="110" cy="71" r="3.5" fill="#000" opacity="0.6"/>
  <circle cx="110" cy="86" r="3.5" fill="#000" opacity="0.6"/>
  <circle cx="110" cy="101" r="3.5" fill="#000" opacity="0.6"/>
  <circle cx="110" cy="116" r="3.5" fill="#000" opacity="0.6"/>
  <circle cx="110" cy="131" r="3.5" fill="#000" opacity="0.6"/>

  <rect x="120" y="70" width="2.5" height="4" fill="#000" opacity="0.5"/>
