  <rect x="120" y="115" width="2.5" height="4" fill="#000" opacity="0.5"/>

  <!-- Far right - vanishing -->
  <circle cx="135" cy="72" r="2.5" fill="#000" opacity="0.3"/>
  <circle cx="135" cy="87" r="2.5" fill="#000" opacity="0.3"/>
  <circle cx="135" cy="102" r="2.5" fill="#000" opacity="0.3"/>

  <rect x="145" y="73" width="2" height="3" fill="#000" opacity="0.2"/>
  <rect x="145" y="88" width="2" height="3" fill="#000" opacity="0.2"/>

  <!-- Final particles -->
  <circle cx="157" cy="75" r="1.5" fill="#000" opacity="0.15"/>
