<!-- Iteration 05: Burning Message - Light Mode -->
<!-- Concept: Document consumed by flame-like triangular form from bottom -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Upper portion: intact horizontal lines (message text) -->
  <line x1="60" y1="50" x2="140" y2="50" stroke="#000" stroke-width="4"/>
  <line x1="60" y1="65" x2="140" y2="65" stroke="#000" stroke-width="4"/>
  <line x1="60" y1="80" x2="135" y2="80" stroke="#000" stroke-width="4"/>

  <!-- Middle portion: partially consumed lines -->
  <line x1="60" y1="95" x2="120" y2="95" stroke="#000" stroke-width="4"/>
  <line x1="60" y1="110" x2="105" y2="110" stroke="#000" stroke-width="4"/>

  <!-- Flame/consumption form rising upward - angular, sharp -->
  <path d="M 100 150 L 85 115 L 95 110 L 90 95 L 100 100 L 110 95 L 105 110 L 115 115 Z"
        fill="#000"/>

  <!-- Smaller flame peaks -->
  <path d="M 75 125 L 70 110 L 80 115 Z" fill="#000"/>
  <path d="M 125 125 L 130 110 L 120 115 Z" fill="#000"/>

  <!-- Rising smoke particles -->
  <circle cx="95" cy="40" r="1.5" fill="#000" opacity="0.4"/>
  <circle cx="105" cy="35" r="1" fill="#000" opacity="0.3"/>
  <circle cx="100" cy="30" r="1.5" fill="#000" opacity="0.2"/>
</svg>
