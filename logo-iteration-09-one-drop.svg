<!-- Iteration 09: One Drop - Light Mode -->
<!-- Concept: Single falling droplet with impact ripple - one moment, one transmission -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Falling drop -->
  <path d="M 100 30 Q 85 50 85 65 Q 85 80 100 80 Q 115 80 115 65 Q 115 50 100 30 Z" fill="#000"/>

  <!-- Motion trails above drop -->
  <ellipse cx="100" cy="20" rx="3" ry="6" fill="#000" opacity="0.4"/>
  <ellipse cx="100" cy="10" rx="2" ry="4" fill="#000" opacity="0.2"/>

  <!-- Impact ripples below -->
  <ellipse cx="100" cy="130" rx="25" ry="8" fill="none" stroke="#000" stroke-width="5"/>
  <ellipse cx="100" cy="135" rx="45" ry="12" fill="none" stroke="#000" stroke-width="3"/>
  <ellipse cx="100" cy="140" rx="65" ry="16" fill="none" stroke="#000" stroke-width="2" opacity="0.6"/>

  <!-- Dispersing droplets from impact -->
  <circle cx="55" cy="145" r="2.5" fill="#000"/>
  <circle cx="145" cy="145" r="2.5" fill="#000"/>
  <circle cx="70" cy="150" r="1.5" fill="#000" opacity="0.7"/>
  <circle cx="130" cy="150" r="1.5" fill="#000" opacity="0.7"/>
</svg>
