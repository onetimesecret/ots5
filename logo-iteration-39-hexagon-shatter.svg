<!-- Iteration 39: Hexagon Shatter - Light Mode -->
<!-- Concept: Perfect hexagon shattering from impact point -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Hexagon outline - left side intact -->
  <path d="M 70 100 L 85 70 L 115 70 L 130 100" fill="none" stroke="#000" stroke-width="5"/>

  <!-- Right side fragmenting -->
  <line x1="130" y1="100" x2="127" y2="115" stroke="#000" stroke-width="4" opacity="0.8"/>
  <line x1="127" y1="115" x2="120" y2="125" stroke="#000" stroke-width="3.5" opacity="0.6"/>

  <!-- Bottom fragmenting -->
  <line x1="120" y1="125" x2="105" y2="130" stroke="#000" stroke-width="3" opacity="0.5"/>
  <line x1="105" y1="130" x2="90" y2="128" stroke="#000" stroke-width="3" opacity="0.5"/>
  <line x1="90" y1="128" x2="75" y2="120" stroke="#000" stroke-width="3.5" opacity="0.6"/>
  <line x1="75" y1="120" x2="70" y2="105" stroke="#000" stroke-width="4" opacity="0.8"/>

  <!-- Shatter lines from impact point (right vertex) -->
  <line x1="130" y1="100" x2="140" y2="95" stroke="#000" stroke-width="2" opacity="0.5"/>
  <line x1="130" y1="100" x2="142" y2="105" stroke="#000" stroke-width="2" opacity="0.5"/>
  <line x1="130" y1="100" x2="145" y2="100" stroke="#000" stroke-width="2.5" opacity="0.6"/>

  <!-- Flying fragments -->
  <path d="M 145 97 L 150 95 L 148 100 Z" fill="#000" opacity="0.4"/>
  <path d="M 147 105 L 152 107 L 150 112 Z" fill="#000" opacity="0.4"/>

  <!-- Dispersing particles -->
  <circle cx="155" cy="93" r="2" fill="#000" opacity="0.3"/>
  <circle cx="157" cy="110" r="2" fill="#000" opacity="0.3"/>
  <circle cx="160" cy="100" r="1.5" fill="#000" opacity="0.2"/>
</svg>
