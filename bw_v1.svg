<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 200">
<text x="570" y="10" font-size="7" opacity=".3">#A1E9</text>
<!-- GLYPH 16×16 -->
<g id="g">
<ellipse cx="28" cy="28" rx="6" ry="4" fill="none" stroke="#000" stroke-width="1.2"/>
<circle cx="28" cy="28" r="1.5"/>
