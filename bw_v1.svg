<circle cx="33" cy="33" r=".8" opacity=".4"/>
<circle cx="30" cy="30" r=".6" opacity=".3"/>
</g>
<!-- LOCKUP 80px -->
<g transform="translate(70,0)">
<ellipse cx="30" cy="60" rx="14" ry="9" fill="none" stroke="#000" stroke-width="2"/>
<circle cx="30" cy="60" r="3.5"/>
<line x1="18" y1="48" x2="42" y2="72" stroke="#000" stroke-width="2.5"/>
<circle cx="42" cy="72" r="2" opacity=".4"/>
<circle cx="36" cy="66" r="1.5" opacity=".3"/>
<text x="60" y="52" font-size="18" font-weight="700">OneTime</text>
<text x="60" y="70" font-size="18" font-weight="300">Secret</text>
</g>
<!-- BADGE 200px -->
<g transform="translate(300,0)">
<ellipse cx="130" cy="70" rx="28" ry="18" fill="none" stroke="#000" stroke-width="3"/>
<circle cx="130" cy="70" r="7"/>
