<!-- CONTEXT: Loading Animation State -->
<!-- Shows logo during message destruction process -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <style>
      .bg { fill: #000000; }
      .fg { fill: #FFFFFF; }
      .text { font-family: 'Helvetica Neue', Arial, sans-serif; fill: #888888; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="300" height="300"/>

  <!-- Fading Echo - mid-destruction state -->
  <g transform="translate(150, 130)">
    <!-- Core fading -->
    <circle class="fg" cx="0" cy="0" r="10" opacity="0.4"/>

    <!-- Rings in various states of dissolution -->
    <circle class="fg" cx="0" cy="0" r="21" fill="none" stroke="white" stroke-width="7" opacity="0.5"/>
    <circle class="fg" cx="0" cy="0" r="34" fill="none" stroke="white" stroke-width="5" opacity="0.6"/>
    <circle class="fg" cx="0" cy="0" r="55" fill="none" stroke="white" stroke-width="3.5"
            stroke-dasharray="10 3" opacity="0.7"/>
    <circle class="fg" cx="0" cy="0" r="70" fill="none" stroke="white" stroke-width="2.5"
            stroke-dasharray="7 5" opacity="0.5"/>
    <circle class="fg" cx="0" cy="0" r="82" fill="none" stroke="white" stroke-width="1.8"
            stroke-dasharray="4 8" opacity="0.3"/>
  </g>

  <!-- Status text -->
  <text class="text" x="150" y="250" font-size="16" font-weight="300">Message destroyed</text>
  <text class="text" x="150" y="270" font-size="12">This secret has been viewed and deleted</text>
</svg>
