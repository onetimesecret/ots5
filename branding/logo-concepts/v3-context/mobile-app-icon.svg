<!-- CONTEXT: Mobile App Icon (iOS/Android style) -->
<!-- Rounded square with logo centered -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <style>
      .bg { fill: #000000; }
      .fg { fill: #FFFFFF; }
    </style>
    <!-- iOS-style app icon with rounded corners -->
    <clipPath id="app-shape">
      <rect x="0" y="0" width="180" height="180" rx="40"/>
    </clipPath>
  </defs>

  <!-- App icon background (black) -->
  <rect class="bg" width="180" height="180" rx="40"/>

  <!-- Logo centered (Fading Echo icon version) -->
  <g transform="translate(90, 90)" clip-path="url(#app-shape)">
    <circle class="fg" cx="0" cy="0" r="8"/>
    <circle class="fg" cx="0" cy="0" r="18" fill="none" stroke="white" stroke-width="5"/>
    <circle class="fg" cx="0" cy="0" r="30" fill="none" stroke="white" stroke-width="3.5"/>
    <circle class="fg" cx="0" cy="0" r="42" fill="none" stroke="white" stroke-width="2.5"
            stroke-dasharray="6 3"/>
    <circle class="fg" cx="0" cy="0" r="54" fill="none" stroke="white" stroke-width="1.8"
            stroke-dasharray="4 5"/>
  </g>

  <!-- Optional: Badge showing notification (red dot) -->
  <circle fill="#FF3333" cx="145" cy="35" r="15"/>
  <text fill="white" x="145" y="42" text-anchor="middle"
        font-family="Arial" font-size="18" font-weight="bold">1</text>
</svg>
