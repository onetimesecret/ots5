<!-- ANIMATED STORYBOARD: Fading Echo - Frame 5/5 -->
<!-- Animation: 100% - Almost vanished -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .bg { fill: #000000; }
      .fg { fill: #FFFFFF; }
    </style>
  </defs>

  <rect class="bg" width="200" height="200"/>

  <!-- Only faintest traces remain -->
  <circle class="fg" cx="100" cy="100" r="70"
          fill="none" stroke="white" stroke-width="2.5"
          stroke-dasharray="7 5" opacity="0.15"/>

  <circle class="fg" cx="100" cy="100" r="82"
          fill="none" stroke="white" stroke-width="1.8"
          stroke-dasharray="4 8" opacity="0.1"/>

  <circle class="fg" cx="100" cy="100" r="91"
          fill="none" stroke="white" stroke-width="1.2"
          stroke-dasharray="2 12" opacity="0.05"/>

  <!-- Final outer echo barely visible -->
  <circle class="fg" cx="100" cy="100" r="96"
          fill="none" stroke="white" stroke-width="0.8"
          stroke-dasharray="1 18" opacity="0.02"/>
</svg>
