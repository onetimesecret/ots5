<!-- V2 REFINED: One-Time Circle (一次性圆环) -->
<!-- Refinements:
     - Cleaner arc with precise geometry
     - Enhanced particle dissolution (gradient decay)
     - Stronger arrow design for directionality
     - Added subtle fragmentation at break point
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .bg { fill: #000000; }
      .fg { fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="200" height="200"/>

  <!-- Main circle arc - 270 degrees, leaving 90-degree break -->
  <path class="fg" d="M 150 100 A 50 50 0 1 1 135.35 35.35"
        fill="none" stroke="white" stroke-width="10"
        stroke-linecap="round"/>

  <!-- Fragmentation at break point - arc dissolving -->
  <path class="fg" d="M 135.35 35.35 A 50 50 0 0 1 141.42 28.58"
        fill="none" stroke="white" stroke-width="8"
        stroke-dasharray="4 2" stroke-linecap="round"/>

  <path class="fg" d="M 141.42 28.58 A 50 50 0 0 1 146 23"
        fill="none" stroke="white" stroke-width="5"
        stroke-dasharray="2 3" stroke-linecap="round"/>

  <!-- Arrow pointing outward (escape/dissolution) -->
  <path class="fg" d="M 135 35 L 147 27 L 141 42 Z"/>

  <!-- Particle trail - exponential decay in size -->
  <!-- Layer 1: Larger fragments just escaped -->
  <circle class="fg" cx="151" cy="22" r="3.5"/>
  <circle class="fg" cx="148" cy="18" r="3"/>

  <!-- Layer 2: Medium particles -->
  <circle class="fg" cx="158" cy="18" r="2.5"/>
  <circle class="fg" cx="154" cy="13" r="2.2"/>

  <!-- Layer 3: Small particles -->
  <circle class="fg" cx="163" cy="15" r="1.8"/>
  <circle class="fg" cx="160" cy="10" r="1.5"/>

  <!-- Layer 4: Tiny particles -->
  <circle class="fg" cx="168" cy="12" r="1.2"/>
  <circle class="fg" cx="165" cy="7" r="1"/>

  <!-- Layer 5: Almost vanished -->
  <circle class="fg" cx="172" cy="9" r="0.7"/>
  <circle class="fg" cx="170" cy="5" r="0.5"/>

  <!-- Central dot - the message/secret origin -->
  <circle class="fg" cx="100" cy="100" r="9"/>
</svg>
