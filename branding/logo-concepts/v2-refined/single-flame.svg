<!-- NEW CONCEPT: Single Flame (一次燃烧) -->
<!-- Visual metaphor: A flame that burns brightly once, then extinguishes
     Represents: Intense but brief existence, one-time combustion
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .bg { fill: #000000; }
      .fg { fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="200" height="200"/>

  <!-- Base - solid foundation (the fuel) -->
  <path class="fg" d="M 85 165 L 115 165 L 110 155 L 90 155 Z"/>

  <!-- Main flame body - largest part -->
  <path class="fg" d="M 90 155 Q 88 140 90 125 Q 92 110 88 95
                       Q 86 80 90 70 Q 92 60 95 55
                       Q 100 45 100 35
                       Q 100 45 105 55 Q 108 60 110 70
                       Q 114 80 112 95 Q 108 110 110 125
                       Q 112 140 110 155 Z"/>

  <!-- Inner flame detail (negative space) -->
  <path class="bg" d="M 96 145 Q 95 135 96 125 Q 97 115 95 105
                       Q 94 95 96 85 Q 98 75 100 68
                       Q 102 75 104 85 Q 106 95 105 105
                       Q 103 115 104 125 Q 105 135 104 145 Z"/>

  <!-- Flame tip - dissolving into smoke -->
  <!-- Top flame wisps -->
  <path class="fg" d="M 95 35 Q 93 28 95 22 Q 97 28 95 35"
        stroke="white" stroke-width="3" fill="white"/>
  <path class="fg" d="M 100 30 Q 98 22 100 15 Q 102 22 100 30"
        stroke="white" stroke-width="4" fill="white"/>
  <path class="fg" d="M 105 35 Q 103 28 105 22 Q 107 28 105 35"
        stroke="white" stroke-width="3" fill="white"/>

  <!-- Smoke wisps - getting thinner and more dispersed -->
  <path class="fg" d="M 96 18 Q 95 14 96 10"
        fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <path class="fg" d="M 100 12 Q 99 8 100 4"
        fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <path class="fg" d="M 104 18 Q 105 14 104 10"
        fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Final smoke traces -->
  <circle class="fg" cx="97" cy="8" r="0.8"/>
  <circle class="fg" cx="100" cy="2" r="1"/>
  <circle class="fg" cx="103" cy="8" r="0.8"/>
</svg>
