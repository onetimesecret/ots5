<!-- NEW CONCEPT: Dissolving Grid (消解的网格) -->
<!-- Visual metaphor: Digital data/pixels fragmenting and scattering
     Represents: Information as structured data breaking down into chaos then nothing
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .bg { fill: #000000; }
      .fg { fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="200" height="200"/>

  <!-- Solid grid core (bottom) - intact data structure -->
  <rect class="fg" x="75" y="125" width="12" height="12"/>
  <rect class="fg" x="88" y="125" width="12" height="12"/>
  <rect class="fg" x="101" y="125" width="12" height="12"/>
  <rect class="fg" x="114" y="125" width="12" height="12"/>

  <rect class="fg" x="75" y="138" width="12" height="12"/>
  <rect class="fg" x="88" y="138" width="12" height="12"/>
  <rect class="fg" x="101" y="138" width="12" height="12"/>
  <rect class="fg" x="114" y="138" width="12" height="12"/>

  <rect class="fg" x="75" y="151" width="12" height="12"/>
  <rect class="fg" x="88" y="151" width="12" height="12"/>
  <rect class="fg" x="101" y="151" width="12" height="12"/>
  <rect class="fg" x="114" y="151" width="12" height="12"/>

  <!-- Fragmenting layer - some gaps appearing -->
  <rect class="fg" x="70" y="108" width="11" height="11"/>
  <rect class="fg" x="86" y="106" width="11" height="11"/>
  <!-- gap -->
  <rect class="fg" x="108" y="107" width="11" height="11"/>
  <rect class="fg" x="120" y="109" width="11" height="11"/>

  <!-- More fragmented layer - irregular spacing -->
  <rect class="fg" x="68" y="88" width="9" height="9"/>
  <!-- gap -->
  <rect class="fg" x="92" y="86" width="9" height="9"/>
  <rect class="fg" x="105" y="90" width="9" height="9"/>
  <!-- gap -->
  <rect class="fg" x="124" y="87" width="9" height="9"/>

  <!-- Heavily fragmented - smaller pieces, more scattered -->
  <rect class="fg" x="64" y="70" width="7" height="7"/>
  <rect class="fg" x="78" y="68" width="7" height="7"/>
  <!-- gaps -->
  <rect class="fg" x="108" y="72" width="7" height="7"/>
  <rect class="fg" x="128" y="69" width="7" height="7"/>

  <!-- Breaking into individual pixels -->
  <rect class="fg" x="60" y="54" width="5" height="5"/>
  <rect class="fg" x="73" y="52" width="5" height="5"/>
  <rect class="fg" x="95" y="56" width="5" height="5"/>
  <rect class="fg" x="112" y="53" width="5" height="5"/>
  <rect class="fg" x="132" y="55" width="5" height="5"/>

  <!-- Scattered particles -->
  <rect class="fg" x="58" y="40" width="3" height="3"/>
  <rect class="fg" x="75" y="38" width="3" height="3"/>
  <rect class="fg" x="88" y="42" width="3" height="3"/>
  <rect class="fg" x="105" y="39" width="3" height="3"/>
  <rect class="fg" x="120" y="41" width="3" height="3"/>
  <rect class="fg" x="135" y="38" width="3" height="3"/>

  <!-- Final dispersion - tiny particles -->
  <rect class="fg" x="62" y="28" width="2" height="2"/>
  <rect class="fg" x="80" y="26" width="2" height="2"/>
  <rect class="fg" x="98" y="29" width="2" height="2"/>
  <rect class="fg" x="115" y="27" width="2" height="2"/>
  <rect class="fg" x="132" y="25" width="2" height="2"/>

  <!-- Almost gone -->
  <rect class="fg" x="70" y="18" width="1" height="1"/>
  <rect class="fg" x="92" y="16" width="1" height="1"/>
  <rect class="fg" x="108" y="17" width="1" height="1"/>
  <rect class="fg" x="126" y="15" width="1" height="1"/>
</svg>
