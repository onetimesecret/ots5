<!-- EXPERIMENTAL: Entropic Decay (熵增衰变) -->
<!-- Concept: Order to chaos to nothingness - thermodynamic interpretation
     Pattern showing increasing entropy -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .bg { fill: #000000; }
      .fg { fill: #FFFFFF; }
    </style>
  </defs>

  <rect class="bg" width="200" height="200"/>

  <!-- Level 1: Perfect order (low entropy) - bottom -->
  <rect class="fg" x="50" y="155" width="10" height="10"/>
  <rect class="fg" x="65" y="155" width="10" height="10"/>
  <rect class="fg" x="80" y="155" width="10" height="10"/>
  <rect class="fg" x="95" y="155" width="10" height="10"/>
  <rect class="fg" x="110" y="155" width="10" height="10"/>
  <rect class="fg" x="125" y="155" width="10" height="10"/>
  <rect class="fg" x="140" y="155" width="10" height="10"/>

  <!-- Level 2: Slight disorder -->
  <rect class="fg" x="52" y="135" width="10" height="10"/>
  <rect class="fg" x="67" y="137" width="10" height="10"/>
  <rect class="fg" x="81" y="133" width="10" height="10"/>
  <rect class="fg" x="97" y="136" width="10" height="10"/>
  <rect class="fg" x="111" y="134" width="10" height="10"/>
  <rect class="fg" x="127" y="138" width="10" height="10"/>
  <rect class="fg" x="138" y="135" width="10" height="10"/>

  <!-- Level 3: Increasing chaos -->
  <rect class="fg" x="48" y="112" width="9" height="9"/>
  <rect class="fg" x="70" y="118" width="9" height="9"/>
  <rect class="fg" x="85" y="110" width="9" height="9"/>
  <rect class="fg" x="98" y="115" width="9" height="9"/>
  <rect class="fg" x="115" y="113" width="9" height="9"/>
  <rect class="fg" x="130" y="117" width="9" height="9"/>
  <rect class="fg" x="143" y="111" width="9" height="9"/>

  <!-- Level 4: High disorder -->
  <rect class="fg" x="55" y="88" width="7" height="7"/>
  <rect class="fg" x="72" y="95" width="7" height="7"/>
  <rect class="fg" x="90" y="85" width="7" height="7"/>
  <rect class="fg" x="105" y="92" width="7" height="7"/>
  <rect class="fg" x="122" y="90" width="7" height="7"/>
  <rect class="fg" x="138" y="88" width="7" height="7"/>

  <!-- Level 5: Near-chaos -->
  <rect class="fg" x="62" y="68" width="5" height="5"/>
  <rect class="fg" x="78" y="72" width="5" height="5"/>
  <rect class="fg" x="95" y="65" width="5" height="5"/>
  <rect class="fg" x="112" y="70" width="5" height="5"/>
  <rect class="fg" x="128" y="67" width="5" height="5"/>

  <!-- Level 6: Scattered particles -->
  <rect class="fg" x="68" y="48" width="3" height="3"/>
  <rect class="fg" x="85" y="52" width="3" height="3"/>
  <rect class="fg" x="100" y="45" width="3" height="3"/>
  <rect class="fg" x="118" y="50" width="3" height="3"/>
  <rect class="fg" x="133" y="47" width="3" height="3"/>

  <!-- Level 7: Maximum entropy (near-void) -->
  <rect class="fg" x="75" y="30" width="2" height="2"/>
  <rect class="fg" x="95" y="28" width="2" height="2"/>
  <rect class="fg" x="115" y="32" width="2" height="2"/>

  <!-- Level 8: Heat death -->
  <circle class="fg" cx="90" cy="15" r="0.8"/>
  <circle class="fg" cx="108" cy="18" r="0.8"/>
</svg>
