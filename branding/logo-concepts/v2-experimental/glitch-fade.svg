<!-- EXPERIMENTAL: Glitch Fade (故障消逝) -->
<!-- Concept: Digital glitch effect - data corruption leading to deletion
     Visual noise resolving to silence -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .bg { fill: #000000; }
      .fg { fill: #FFFFFF; }
    </style>
  </defs>

  <rect class="bg" width="200" height="200"/>

  <!-- Left: Intact data block -->
  <rect class="fg" x="30" y="80" width="35" height="40"/>
  <rect class="bg" x="35" y="85" width="25" height="5"/>
  <rect class="bg" x="35" y="95" width="25" height="5"/>
  <rect class="bg" x="35" y="105" width="25" height="5"/>

  <!-- Glitch zone 1: Horizontal displacement -->
  <rect class="fg" x="68" y="80" width="30" height="8"/>
  <rect class="fg" x="72" y="92" width="28" height="6"/>
  <rect class="fg" x="70" y="102" width="26" height="9"/>
  <rect class="fg" x="75" y="114" width="22" height="6"/>

  <!-- Glitch zone 2: Breaking into scan lines -->
  <rect class="fg" x="103" y="81" width="20" height="3"/>
  <rect class="fg" x="105" y="88" width="18" height="2"/>
  <rect class="fg" x="104" y="94" width="19" height="3"/>
  <rect class="fg" x="106" y="101" width="17" height="2"/>
  <rect class="fg" x="105" y="107" width="16" height="3"/>
  <rect class="fg" x="107" y="114" width="14" height="2"/>

  <!-- Glitch zone 3: Fragmenting into noise -->
  <rect class="fg" x="128" y="83" width="8" height="2"/>
  <rect class="fg" x="129" y="89" width="6" height="1.5"/>
  <rect class="fg" x="127" y="95" width="7" height="2"/>
  <rect class="fg" x="130" y="102" width="5" height="1.5"/>
  <rect class="fg" x="128" y="108" width="6" height="2"/>
  <rect class="fg" x="131" y="115" width="4" height="1.5"/>

  <!-- Glitch zone 4: Static particles -->
  <rect class="fg" x="142" y="85" width="3" height="1.5"/>
  <rect class="fg" x="143" y="92" width="2" height="1"/>
  <rect class="fg" x="141" y="98" width="3" height="1.5"/>
  <rect class="fg" x="144" y="105" width="2" height="1"/>
  <rect class="fg" x="142" y="112" width="2.5" height="1.5"/>

  <!-- Glitch zone 5: Noise dissolving -->
  <rect class="fg" x="152" y="88" width="1.5" height="1"/>
  <rect class="fg" x="153" y="95" width="1" height="0.8"/>
  <rect class="fg" x="151" y="102" width="1.5" height="1"/>
  <rect class="fg" x="154" y="109" width="1" height="0.8"/>

  <!-- Final: Random pixels (static) -->
  <rect class="fg" x="163" y="91" width="0.8" height="0.8"/>
  <rect class="fg" x="164" y="98" width="0.6" height="0.6"/>
  <rect class="fg" x="162" y="105" width="0.8" height="0.8"/>

  <!-- Silence -->
</svg>
