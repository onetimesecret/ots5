<!-- COLOR ACCENT: Fading Echo - Blue Trust -->
<!-- Blue center (represents trust/security before vanishing) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .bg { fill: #000000; }
      .fg { fill: #FFFFFF; }
      .accent { fill: #0088FF; stroke: #0088FF; }
    </style>
  </defs>

  <rect class="bg" width="200" height="200"/>

  <!-- Center - BLUE accent (security/trust at the moment of creation) -->
  <circle class="accent" cx="100" cy="100" r="10"/>

  <!-- First echo - blue fading to white -->
  <circle class="accent" cx="100" cy="100" r="21" fill="none" stroke-width="7"/>

  <!-- Rest - white -->
  <circle class="fg" cx="100" cy="100" r="34" fill="none" stroke="white" stroke-width="5"/>
  <circle class="fg" cx="100" cy="100" r="55" fill="none" stroke="white" stroke-width="3.5" stroke-dasharray="10 3"/>
  <circle class="fg" cx="100" cy="100" r="70" fill="none" stroke="white" stroke-width="2.5" stroke-dasharray="7 5"/>
  <circle class="fg" cx="100" cy="100" r="82" fill="none" stroke="white" stroke-width="1.8" stroke-dasharray="4 8"/>
  <circle class="fg" cx="100" cy="100" r="91" fill="none" stroke="white" stroke-width="1.2" stroke-dasharray="2 12"/>
</svg>
