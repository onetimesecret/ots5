<!-- COLOR ACCENT: Fading Echo - Red Danger -->
<!-- Single red accent on the vanishing outer ring (represents danger/urgency) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .bg { fill: #000000; }
      .fg { fill: #FFFFFF; }
      .accent { fill: #FF0033; stroke: #FF0033; }
    </style>
  </defs>

  <rect class="bg" width="200" height="200"/>

  <!-- Center - white -->
  <circle class="fg" cx="100" cy="100" r="10"/>

  <!-- Echoes - white -->
  <circle class="fg" cx="100" cy="100" r="21" fill="none" stroke="white" stroke-width="7"/>
  <circle class="fg" cx="100" cy="100" r="34" fill="none" stroke="white" stroke-width="5"/>
  <circle class="fg" cx="100" cy="100" r="55" fill="none" stroke="white" stroke-width="3.5" stroke-dasharray="10 3"/>
  <circle class="fg" cx="100" cy="100" r="70" fill="none" stroke="white" stroke-width="2.5" stroke-dasharray="7 5"/>

  <!-- Outermost echo - RED accent (danger/deletion) -->
  <circle class="accent" cx="100" cy="100" r="82" fill="none" stroke-width="1.8" stroke-dasharray="4 8"/>
  <circle class="accent" cx="100" cy="100" r="91" fill="none" stroke-width="1.2" stroke-dasharray="2 12"/>
  <circle class="accent" cx="100" cy="100" r="96" fill="none" stroke-width="0.8" stroke-dasharray="1 18"/>
</svg>
