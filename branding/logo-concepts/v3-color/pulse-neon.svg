<!-- COLOR ACCENT: Minimal Pulse - Neon Heartbeat -->
<!-- Neon cyan pulse on black -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .bg { fill: #000000; }
      .neon { fill: none; stroke: #00FFFF; filter: drop-shadow(0 0 3px #00FFFF); }
      .neon-bright { fill: none; stroke: #00FFFF; filter: drop-shadow(0 0 5px #00FFFF) drop-shadow(0 0 10px #00FFFF); }
    </style>
  </defs>

  <rect class="bg" width="64" height="64"/>

  <!-- Horizontal baseline - neon -->
  <line class="neon" x1="8" y1="32" x2="20" y2="32" stroke-width="2" stroke-linecap="round"/>

  <!-- Pulse spike (the message) - bright neon -->
  <path class="neon-bright" d="M 20 32 L 26 16 L 32 32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dissolving continuation - neon fading -->
  <line class="neon" x1="32" y1="32" x2="40" y2="32" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 2"/>

  <!-- Fading particles -->
  <line class="neon" x1="42" y1="32" x2="48" y2="32" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.7"/>

  <!-- Almost gone -->
  <line class="neon" x1="50" y1="32" x2="54" y2="32" stroke-width="1" stroke-linecap="round" stroke-dasharray="1 4" opacity="0.4"/>

  <!-- Final dot -->
  <circle fill="#00FFFF" cx="56" cy="32" r="0.8" opacity="0.3"/>
</svg>
