<!-- ICON: Minimal Pulse (极简脉冲) -->
<!-- Ultra-minimalist icon: single pulse line dissolving -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .bg { fill: #000000; }
      .fg { fill: #FFFFFF; }
    </style>
  </defs>

  <rect class="bg" width="64" height="64"/>

  <!-- Horizontal baseline -->
  <line class="fg" x1="8" y1="32" x2="20" y2="32"
        stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Pulse spike (the message) -->
  <path class="fg" d="M 20 32 L 26 16 L 32 32"
        fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dissolving continuation -->
  <line class="fg" x1="32" y1="32" x2="40" y2="32"
        stroke="white" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="4 2"/>

  <!-- Fading particles -->
  <line class="fg" x1="42" y1="32" x2="48" y2="32"
        stroke="white" stroke-width="1.5" stroke-linecap="round"
        stroke-dasharray="2 3"/>

  <!-- Almost gone -->
  <line class="fg" x1="50" y1="32" x2="54" y2="32"
        stroke="white" stroke-width="1" stroke-linecap="round"
        stroke-dasharray="1 4"/>

  <!-- Final dot -->
  <circle class="fg" cx="56" cy="32" r="0.8"/>
</svg>
