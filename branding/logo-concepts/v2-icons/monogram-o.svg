<!-- ICON: Monogram "O" Dissolving -->
<!-- Letter-based icon for OTS - the "O" breaking apart -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .bg { fill: #000000; }
      .fg { fill: #FFFFFF; }
    </style>
  </defs>

  <rect class="bg" width="64" height="64"/>

  <!-- "O" - mostly complete circle, fragmenting at top right -->
  <!-- Bottom and left - solid -->
  <path class="fg" d="M 48 32 A 16 16 0 0 1 32 48 A 16 16 0 0 1 16 32 A 16 16 0 0 1 32 16 A 16 16 0 0 1 42 18"
        fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>

  <!-- Inner cutout -->
  <circle class="bg" cx="32" cy="32" r="10"/>

  <!-- Top right - fragmenting into pieces -->
  <path class="fg" d="M 42 18 A 16 16 0 0 1 46 22"
        fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>

  <!-- Fragments breaking off -->
  <rect class="fg" x="46" y="15" width="3" height="5" transform="rotate(30 47.5 17.5)"/>
  <rect class="fg" x="50" y="13" width="2" height="4" transform="rotate(40 51 15)"/>
  <rect class="fg" x="54" y="12" width="2" height="3" transform="rotate(50 55 13.5)"/>

  <!-- Tiny particles -->
  <circle class="fg" cx="57" cy="10" r="1"/>
  <circle class="fg" cx="60" cy="9" r="0.7"/>
</svg>
