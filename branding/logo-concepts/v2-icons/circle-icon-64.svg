<!-- ICON OPTIMIZED: One-Time Circle - 64px -->
<!-- Bold, clear for icon use -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .bg { fill: #000000; }
      .fg { fill: #FFFFFF; }
    </style>
  </defs>

  <rect class="bg" width="64" height="64"/>

  <!-- Main arc - thicker for visibility -->
  <path class="fg" d="M 48 32 A 16 16 0 1 1 43.3 13.7"
        fill="none" stroke="white" stroke-width="4"
        stroke-linecap="round"/>

  <!-- Arrow -->
  <path class="fg" d="M 43 14 L 49 9 L 46 17 Z"/>

  <!-- Simplified particle trail - only 3 particles -->
  <circle class="fg" cx="51" cy="8" r="1.8"/>
  <circle class="fg" cx="55" cy="6" r="1.3"/>
  <circle class="fg" cx="58" cy="5" r="0.8"/>

  <!-- Center dot -->
  <circle class="fg" cx="32" cy="32" r="3"/>
</svg>
