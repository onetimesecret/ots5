<!-- ICON OPTIMIZED: Vanishing Dot - 64px -->
<!-- Simplified particle pattern for icon clarity -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .bg { fill: #000000; }
      .fg { fill: #FFFFFF; }
    </style>
  </defs>

  <rect class="bg" width="64" height="64"/>

  <!-- Center - solid core -->
  <circle class="fg" cx="32" cy="32" r="6"/>

  <!-- First ring - 4 larger dots (cardinal directions) -->
  <circle class="fg" cx="20" cy="32" r="3"/>
  <circle class="fg" cx="44" cy="32" r="3"/>
  <circle class="fg" cx="32" cy="20" r="3"/>
  <circle class="fg" cx="32" cy="44" r="3"/>

  <!-- Second ring - 8 medium dots -->
  <circle class="fg" cx="14" cy="32" r="2"/>
  <circle class="fg" cx="50" cy="32" r="2"/>
  <circle class="fg" cx="32" cy="14" r="2"/>
  <circle class="fg" cx="32" cy="50" r="2"/>
  <circle class="fg" cx="22" cy="22" r="2"/>
  <circle class="fg" cx="42" cy="22" r="2"/>
  <circle class="fg" cx="22" cy="42" r="2"/>
  <circle class="fg" cx="42" cy="42" r="2"/>

  <!-- Third ring - 8 small dots -->
  <circle class="fg" cx="8" cy="32" r="1.2"/>
  <circle class="fg" cx="56" cy="32" r="1.2"/>
  <circle class="fg" cx="32" cy="8" r="1.2"/>
  <circle class="fg" cx="32" cy="56" r="1.2"/>
  <circle class="fg" cx="16" cy="16" r="1.2"/>
  <circle class="fg" cx="48" cy="16" r="1.2"/>
  <circle class="fg" cx="16" cy="48" r="1.2"/>
  <circle class="fg" cx="48" cy="48" r="1.2"/>
</svg>
