<!-- TYPOGRAPHY: Fading Echo + OTS Wordmark -->
<!-- Logo integrated with brand name -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <style>
      .bg { fill: #000000; }
      .fg { fill: #FFFFFF; }
      .text { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 200; }
    </style>
  </defs>

  <rect class="bg" width="400" height="120"/>

  <!-- Logo on left (scaled down) -->
  <g transform="translate(60, 60)">
    <circle class="fg" cx="0" cy="0" r="5"/>
    <circle class="fg" cx="0" cy="0" r="12" fill="none" stroke="white" stroke-width="3.5"/>
    <circle class="fg" cx="0" cy="0" r="19" fill="none" stroke="white" stroke-width="2.5"/>
    <circle class="fg" cx="0" cy="0" r="28" fill="none" stroke="white" stroke-width="1.8" stroke-dasharray="5 2"/>
    <circle class="fg" cx="0" cy="0" r="36" fill="none" stroke="white" stroke-width="1.2" stroke-dasharray="3 4"/>
    <circle class="fg" cx="0" cy="0" r="43" fill="none" stroke="white" stroke-width="0.8" stroke-dasharray="1 8"/>
  </g>

  <!-- Wordmark: OTS -->
  <text class="fg text" x="130" y="75" font-size="56" letter-spacing="8">OTS</text>

  <!-- Tagline (optional, small) -->
  <text class="fg text" x="132" y="92" font-size="10" letter-spacing="3" opacity="0.6">ONETIME SECRET</text>
</svg>
