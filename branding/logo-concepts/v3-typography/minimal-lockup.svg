<!-- TYPOGRAPHY: Minimal Pulse + Compact Lockup -->
<!-- Ultra-minimal horizontal layout -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <style>
      .bg { fill: #000000; }
      .fg { fill: #FFFFFF; }
      .text { font-family: 'Courier New', monospace; font-weight: 400; }
    </style>
  </defs>

  <rect class="bg" width="300" height="80"/>

  <!-- Minimal pulse logo (inline) -->
  <g transform="translate(20, 40)">
    <line class="fg" x1="0" y1="0" x2="8" y2="0" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <path class="fg" d="M 8 0 L 13 -12 L 18 0" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line class="fg" x1="18" y1="0" x2="28" y2="0" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 2"/>
    <line class="fg" x1="30" y1="0" x2="36" y2="0" stroke="white" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/>
    <circle class="fg" cx="38" cy="0" r="0.8"/>
  </g>

  <!-- Monospace text -->
  <text class="fg text" x="70" y="48" font-size="24" letter-spacing="2">OTS</text>
  <text class="fg text" x="72" y="60" font-size="8" letter-spacing="1" opacity="0.5">ephemeral</text>
</svg>
