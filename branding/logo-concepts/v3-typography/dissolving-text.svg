<!-- TYPOGRAPHY: Text Dissolving Effect -->
<!-- Letters themselves fade/pixelate -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <style>
      .bg { fill: #000000; }
      .fg { fill: #FFFFFF; }
      .text { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <rect class="bg" width="400" height="100"/>

  <!-- "O" - solid -->
  <text class="fg text" x="40" y="70" font-size="72" opacity="1">O</text>

  <!-- "T" - starting to pixelate -->
  <text class="fg text" x="120" y="70" font-size="72" opacity="0.85">T</text>
  <rect class="fg" x="135" y="15" width="4" height="6" opacity="0.6"/>
  <rect class="fg" x="143" y="18" width="3" height="5" opacity="0.5"/>

  <!-- "S" - more fragmented -->
  <text class="fg text" x="190" y="70" font-size="72" opacity="0.7">S</text>
  <rect class="fg" x="208" y="20" width="5" height="7" opacity="0.5"/>
  <rect class="fg" x="218" y="23" width="4" height="5" opacity="0.4"/>
  <rect class="fg" x="226" y="26" width="3" height="4" opacity="0.3"/>

  <!-- Dissolving particles after "S" -->
  <rect class="fg" x="265" y="35" width="6" height="8" opacity="0.4"/>
  <rect class="fg" x="278" y="40" width="5" height="6" opacity="0.3"/>
  <rect class="fg" x="290" y="43" width="4" height="5" opacity="0.25"/>

  <rect class="fg" x="302" y="47" width="3" height="4" opacity="0.2"/>
  <rect class="fg" x="312" y="50" width="3" height="3" opacity="0.15"/>

  <rect class="fg" x="322" y="52" width="2" height="3" opacity="0.1"/>
  <rect class="fg" x="330" y="54" width="2" height="2" opacity="0.08"/>

  <circle class="fg" cx="340" cy="56" r="1" opacity="0.05"/>
  <circle class="fg" cx="348" cy="57" r="0.8" opacity="0.03"/>
</svg>
