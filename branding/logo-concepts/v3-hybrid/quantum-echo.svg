<!-- HYBRID: Quantum State + Echo -->
<!-- Superposition rings fading from solid to probability cloud -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .bg { fill: #000000; }
      .fg { fill: #FFFFFF; }
    </style>
    <linearGradient id="quantum-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:0.7" />
      <stop offset="70%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
  </defs>

  <rect class="bg" width="200" height="200"/>

  <!-- Left side: Observed state (solid echo rings) -->
  <g opacity="1">
    <circle class="fg" cx="70" cy="100" r="8"/>
    <circle class="fg" cx="70" cy="100" r="18" fill="none" stroke="white" stroke-width="4"/>
  </g>

  <!-- Observation line -->
  <line class="fg" x1="85" y1="75" x2="85" y2="125"
        stroke="white" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Transition zone: Superposition (gradient opacity) -->
  <circle fill="url(#quantum-gradient)" cx="100" cy="100" r="20"/>

  <!-- Middle: Fragmenting echoes with decreasing opacity -->
  <circle class="fg" cx="105" cy="95" r="6" opacity="0.8"/>
  <circle class="fg" cx="112" cy="100" r="5" opacity="0.7"/>
  <circle class="fg" cx="105" cy="108" r="5" opacity="0.75"/>

  <!-- Right side: Probability cloud (scattered particles) -->
  <circle class="fg" cx="125" cy="95" r="4" opacity="0.6"/>
  <circle class="fg" cx="133" cy="100" r="3.5" opacity="0.5"/>
  <circle class="fg" cx="128" cy="108" r="4" opacity="0.55"/>

  <circle class="fg" cx="140" cy="92" r="2.5" opacity="0.4"/>
  <circle class="fg" cx="146" cy="100" r="3" opacity="0.35"/>
  <circle class="fg" cx="142" cy="110" r="2.5" opacity="0.4"/>

  <circle class="fg" cx="153" cy="96" r="2" opacity="0.25"/>
  <circle class="fg" cx="158" cy="103" r="2" opacity="0.2"/>
  <circle class="fg" cx="155" cy="108" r="1.5" opacity="0.25"/>

  <!-- Final dispersion -->
  <circle class="fg" cx="165" cy="98" r="1" opacity="0.15"/>
  <circle class="fg" cx="170" cy="103" r="1" opacity="0.1"/>
  <circle class="fg" cx="167" cy="106" r="0.8" opacity="0.12"/>
</svg>
