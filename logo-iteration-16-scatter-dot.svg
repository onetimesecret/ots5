<!-- Iteration 16: Scatter Dot - Light Mode -->
<!-- Concept: Dense center point exploding outward into particles - moment of transmission -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Central dense core -->
  <circle cx="100" cy="100" r="12" fill="#000"/>

  <!-- Inner ring of particles -->
  <circle cx="100" cy="75" r="4" fill="#000"/>
  <circle cx="125" cy="100" r="4" fill="#000"/>
  <circle cx="100" cy="125" r="4" fill="#000"/>
  <circle cx="75" cy="100" r="4" fill="#000"/>

  <circle cx="115" cy="85" r="3.5" fill="#000"/>
  <circle cx="115" cy="115" r="3.5" fill="#000"/>
  <circle cx="85" cy="115" r="3.5" fill="#000"/>
  <circle cx="85" cy="85" r="3.5" fill="#000"/>

  <!-- Outer ring - smaller, fading -->
  <circle cx="100" cy="55" r="3" fill="#000" opacity="0.7"/>
  <circle cx="145" cy="100" r="3" fill="#000" opacity="0.7"/>
  <circle cx="100" cy="145" r="3" fill="#000" opacity="0.7"/>
  <circle cx="55" cy="100" r="3" fill="#000" opacity="0.7"/>

  <circle cx="130" cy="70" r="2.5" fill="#000" opacity="0.5"/>
  <circle cx="130" cy="130" r="2.5" fill="#000" opacity="0.5"/>
  <circle cx="70" cy="130" r="2.5" fill="#000" opacity="0.5"/>
  <circle cx="70" cy="70" r="2.5" fill="#000" opacity="0.5"/>

  <!-- Farthest particles -->
  <circle cx="100" cy="40" r="2" fill="#000" opacity="0.3"/>
  <circle cx="160" cy="100" r="2" fill="#000" opacity="0.3"/>
  <circle cx="100" cy="160" r="2" fill="#000" opacity="0.3"/>
  <circle cx="40" cy="100" r="2" fill="#000" opacity="0.3"/>
</svg>
