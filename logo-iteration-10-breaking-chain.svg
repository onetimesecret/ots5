<!-- Iteration 10: Breaking Chain - Light Mode -->
<!-- Concept: Chain link breaking at the moment of viewing - connection then severance -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Left link - intact -->
  <ellipse cx="70" cy="100" rx="20" ry="30" fill="none" stroke="#000" stroke-width="10"/>

  <!-- Right link - fragmenting -->
  <path d="M 110 70 Q 105 70 105 75 L 105 95" fill="none" stroke="#000" stroke-width="10"/>
  <path d="M 105 105 L 105 125 Q 105 130 110 130" fill="none" stroke="#000" stroke-width="10"/>

  <path d="M 130 70 Q 135 70 135 75 L 135 90" fill="none" stroke="#000" stroke-width="10"/>
  <path d="M 135 110 L 135 125 Q 135 130 130 130" fill="none" stroke="#000" stroke-width="10"/>

  <!-- Breaking point - gap with particles -->
  <circle cx="115" cy="100" r="3" fill="#000"/>
  <circle cx="125" cy="100" r="3" fill="#000"/>
  <circle cx="120" cy="95" r="2" fill="#000"/>
  <circle cx="120" cy="105" r="2" fill="#000"/>

  <!-- Dispersing fragments -->
  <circle cx="145" cy="95" r="2.5" fill="#000" opacity="0.6"/>
  <circle cx="150" cy="105" r="2" fill="#000" opacity="0.4"/>
  <circle cx="155" cy="100" r="1.5" fill="#000" opacity="0.3"/>
</svg>
