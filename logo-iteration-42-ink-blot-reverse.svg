<!-- Iteration 42: Ink Blot Reverse - Light Mode -->
<!-- Concept: Ink blot receding, shrinking - reverse of spreading -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer faded edge - where ink was -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#000" stroke-width="1" opacity="0.1"/>

  <!-- Middle receding edge -->
  <circle cx="100" cy="100" r="55" fill="none" stroke="#000" stroke-width="2" opacity="0.2"/>
  <circle cx="100" cy="100" r="42" fill="none" stroke="#000" stroke-width="3" opacity="0.35"/>

  <!-- Inner active edge - shrinking -->
  <circle cx="100" cy="100" r="30" fill="none" stroke="#000" stroke-width="5" opacity="0.6"/>

  <!-- Dense center - what remains -->
  <circle cx="100" cy="100" r="18" fill="#000" opacity="0.8"/>
  <circle cx="100" cy="100" r="8" fill="#000"/>

  <!-- Inward motion indicators -->
  <line x1="150" y1="100" x2="135" y2="100" stroke="#000" stroke-width="1.5" opacity="0.15"/>
  <line x1="50" y1="100" x2="65" y2="100" stroke="#000" stroke-width="1.5" opacity="0.15"/>
  <line x1="100" y1="50" x2="100" y2="65" stroke="#000" stroke-width="1.5" opacity="0.15"/>
  <line x1="100" y1="150" x2="100" y2="135" stroke="#000" stroke-width="1.5" opacity="0.15"/>
</svg>
