<!-- Iteration 23: Void Portal - Light Mode -->
<!-- Concept: Spiraling void pulling information into nothingness -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Spiraling arcs drawing inward -->
  <path d="M 100 50 Q 150 100 100 150" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/>

  <path d="M 100 60 Q 140 100 100 140" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round"/>

  <path d="M 100 70 Q 130 100 100 130" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/>

  <path d="M 100 80 Q 120 100 100 120" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>

  <!-- Center void -->
  <circle cx="100" cy="100" r="12" fill="#000"/>

  <!-- Particles being pulled in -->
  <circle cx="145" cy="75" r="2.5" fill="#000" opacity="0.6"/>
  <circle cx="155" cy="100" r="2" fill="#000" opacity="0.4"/>
  <circle cx="145" cy="125" r="2.5" fill="#000" opacity="0.6"/>
</svg>
