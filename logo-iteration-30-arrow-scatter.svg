<!-- Iteration 30: Arrow Scatter - Light Mode -->
<!-- Concept: Forward arrow disintegrating - transmission that destroys itself -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Arrow shaft - solid at left, fragmenting right -->
  <rect x="30" y="95" width="50" height="10" fill="#000"/>

  <!-- Fragmenting shaft -->
  <rect x="82" y="95" width="18" height="10" fill="#000" opacity="0.9"/>
  <rect x="103" y="96" width="12" height="8" fill="#000" opacity="0.7"/>
  <rect x="118" y="97" width="8" height="6" fill="#000" opacity="0.5"/>

  <!-- Arrow head - breaking apart -->
  <path d="M 130 100 L 145 85 L 148 90 Z" fill="#000" opacity="0.8"/>
  <path d="M 130 100 L 145 115 L 148 110 Z" fill="#000" opacity="0.8"/>

  <!-- Dispersing head fragments -->
  <path d="M 150 87 L 155 80 L 157 85 Z" fill="#000" opacity="0.5"/>
  <path d="M 150 113 L 155 120 L 157 115 Z" fill="#000" opacity="0.5"/>

  <!-- Trailing particles -->
  <circle cx="160" cy="82" r="2" fill="#000" opacity="0.3"/>
  <circle cx="163" cy="118" r="2" fill="#000" opacity="0.3"/>
  <circle cx="167" cy="100" r="2.5" fill="#000" opacity="0.2"/>
</svg>
