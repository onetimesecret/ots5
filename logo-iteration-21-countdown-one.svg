<!-- Iteration 21: Countdown One - Light Mode -->
<!-- Concept: Bold "1" disintegrating - one time, one view -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Main vertical stroke of "1" - solid at top, fragmenting below -->
  <rect x="92" y="50" width="16" height="40" fill="#000"/>

  <!-- Middle section - starting to break -->
  <rect x="92" y="92" width="16" height="18" fill="#000"/>
  <rect x="92" y="113" width="16" height="15" fill="#000" opacity="0.9"/>

  <!-- Lower section - fragmenting -->
  <rect x="92" y="131" width="14" height="10" fill="#000" opacity="0.7"/>
  <rect x="93" y="143" width="12" height="7" fill="#000" opacity="0.5"/>

  <!-- Dispersing pieces -->
  <rect x="94" y="152" width="8" height="4" fill="#000" opacity="0.3"/>
  <rect x="96" y="158" width="5" height="3" fill="#000" opacity="0.2"/>

  <!-- Top serif/flag of "1" -->
  <rect x="82" y="50" width="10" height="8" fill="#000"/>

  <!-- Falling particles -->
  <circle cx="88" cy="165" r="2" fill="#000" opacity="0.4"/>
  <circle cx="112" cy="168" r="1.5" fill="#000" opacity="0.3"/>
</svg>
