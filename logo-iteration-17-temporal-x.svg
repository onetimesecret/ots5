<!-- Iteration 17: Temporal X - Light Mode -->
<!-- Concept: X mark forming/dissolving simultaneously - deletion in progress -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Top-left to bottom-right stroke - solid to fragmenting -->
  <path d="M 60 60 L 100 100" stroke="#000" stroke-width="14" stroke-linecap="round"/>
  <line x1="100" y1="100" x2="120" y2="120" stroke="#000" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <line x1="120" y1="120" x2="132" y2="132" stroke="#000" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <circle cx="138" cy="138" r="2" fill="#000" opacity="0.3"/>

  <!-- Top-right to bottom-left stroke - solid to fragmenting -->
  <path d="M 140 60 L 100 100" stroke="#000" stroke-width="14" stroke-linecap="round"/>
  <line x1="100" y1="100" x2="80" y2="120" stroke="#000" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <line x1="80" y1="120" x2="68" y2="132" stroke="#000" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <circle cx="62" cy="138" r="2" fill="#000" opacity="0.3"/>
</svg>
