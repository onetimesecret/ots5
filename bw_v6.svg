<path d="M23 54l7 6-7 6" fill="none" stroke="#000" stroke-width="2.5"/>
<path d="M22 57l4-4m0 14l4-4" stroke="#000" stroke-width="2" opacity=".5"/>
<path d="M38 57l4-4m0 14l4-4" stroke="#000" stroke-width="1.5" opacity=".3"/>
<text x="60" y="52" font-size="18" font-weight="700">OneTime</text>
<text x="60" y="70" font-size="18" font-weight="300">Secret</text>
