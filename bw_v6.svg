<!-- BADGE 200px -->
<g transform="translate(300,0)">
<circle cx="130" cy="70" r="26" fill="none" stroke="#000" stroke-width="4"/>
<path d="M115 58l15 12-15 12" fill="none" stroke="#000" stroke-width="4"/>
