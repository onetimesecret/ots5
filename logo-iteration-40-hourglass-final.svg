<!-- Iteration 40: Hourglass Final - Light Mode -->
<!-- Concept: Last grain falling - time expired, message gone -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Hourglass frame -->
  <path d="M 65 50 L 135 50 L 100 100 L 135 150 L 65 150 L 100 100 Z"
        fill="none" stroke="#000" stroke-width="4"/>

  <!-- Top chamber - empty -->
  <!-- Bottom chamber - nearly empty -->
  <path d="M 95 145 L 100 140 L 105 145 Z" fill="#000"/>

  <!-- Single grain falling through neck -->
  <circle cx="100" cy="95" r="2.5" fill="#000"/>

  <!-- Motion blur/trail of falling grain -->
  <circle cx="100" cy="90" r="1.5" fill="#000" opacity="0.3"/>
  <circle cx="100" cy="85" r="1" fill="#000" opacity="0.15"/>

  <!-- Tiny pile at bottom -->
  <ellipse cx="100" cy="146" rx="6" ry="2" fill="#000"/>
</svg>
