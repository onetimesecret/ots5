<!-- Iteration 13: Whisper Path - Light Mode -->
<!-- Concept: Curved path that thins to invisibility - like a whisper fading -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Single elegant curved stroke that tapers to nothing -->
  <path d="M 40 100 Q 70 60 100 80 Q 130 100 160 70"
        fill="none" stroke="#000" stroke-width="20" stroke-linecap="round" opacity="1"/>

  <path d="M 160 70 Q 165 67 170 65"
        fill="none" stroke="#000" stroke-width="10" stroke-linecap="round" opacity="0.7"/>

  <path d="M 170 65 Q 173 63 176 62"
        fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" opacity="0.4"/>

  <path d="M 176 62 Q 178 61 180 60"
        fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" opacity="0.2"/>

  <!-- Vanishing point -->
  <circle cx="182" cy="59" r="0.5" fill="#000" opacity="0.1"/>
</svg>
