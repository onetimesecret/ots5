<!-- Iteration 19: Open-Closed - Light Mode -->
<!-- Concept: Bracket opening then closing - the brief window of access -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Left bracket - open -->
  <path d="M 80 65 L 65 65 L 65 135 L 80 135" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/>

  <!-- Middle - fragmenting bracket pieces -->
  <path d="M 95 70 L 90 70" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <path d="M 95 130 L 90 130" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round" opacity="0.8"/>

  <path d="M 105 75 L 102 75" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <path d="M 105 125 L 102 125" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

  <!-- Right bracket - closing/closed -->
  <path d="M 120 65 L 135 65 L 135 135 L 120 135" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/>

  <!-- Content vanishing in the middle -->
  <circle cx="100" cy="100" r="3" fill="#000" opacity="0.4"/>
  <circle cx="100" cy="90" r="2" fill="#000" opacity="0.3"/>
  <circle cx="100" cy="110" r="2" fill="#000" opacity="0.3"/>
</svg>
