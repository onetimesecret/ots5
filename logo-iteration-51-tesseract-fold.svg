<!-- Iteration 51: Tesseract Fold - Light Mode -->
<!-- Concept: 4D hypercube folding out of our dimension - dimensional ephemerality -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer cube -->
  <path d="M 65 75 L 105 55 L 145 75 L 105 95 Z" fill="none" stroke="#000" stroke-width="3"/>
  <path d="M 65 75 L 65 115 L 105 135 L 105 95 Z" fill="none" stroke="#000" stroke-width="3"/>
  <path d="M 145 75 L 145 115 L 105 135 L 105 95 Z" fill="none" stroke="#000" stroke-width="3"/>

  <!-- Inner cube - fragmenting -->
  <path d="M 80 85 L 105 72 L 130 85" fill="none" stroke="#000" stroke-width="2.5" opacity="0.7"/>
  <path d="M 80 85 L 80 110" fill="none" stroke="#000" stroke-width="2.5" opacity="0.7"/>
  <path d="M 130 85 L 130 110" fill="none" stroke="#000" stroke-width="2.5" opacity="0.7"/>
  <path d="M 80 110 L 105 120 L 130 110" fill="none" stroke="#000" stroke-width="2.5" opacity="0.7"/>

  <!-- Connection lines - fading -->
  <line x1="65" y1="75" x2="80" y2="85" stroke="#000" stroke-width="1.5" opacity="0.4"/>
  <line x1="105" y1="55" x2="105" y2="72" stroke="#000" stroke-width="1.5" opacity="0.4"/>
  <line x1="145" y1="75" x2="130" y2="85" stroke="#000" stroke-width="1.5" opacity="0.4"/>
  <line x1="65" y1="115" x2="80" y2="110" stroke="#000" stroke-width="1.5" opacity="0.4"/>

  <!-- Fragmenting vertices -->
  <circle cx="105" cy="72" r="2.5" fill="#000" opacity="0.5"/>
  <circle cx="80" cy="85" r="2.5" fill="#000" opacity="0.5"/>
  <circle cx="130" cy="85" r="2.5" fill="#000" opacity="0.5"/>

  <!-- Particles escaping to another dimension -->
  <circle cx="95" cy="65" r="2" fill="#000" opacity="0.3"/>
  <circle cx="115" cy="65" r="2" fill="#000" opacity="0.3"/>
  <circle cx="105" cy="60" r="1.5" fill="#000" opacity="0.2"/>
  <circle cx="90" cy="58" r="1.2" fill="#000" opacity="0.15"/>
  <circle cx="120" cy="58" r="1.2" fill="#000" opacity="0.15"/>
</svg>
