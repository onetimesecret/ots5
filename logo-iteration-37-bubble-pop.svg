<!-- Iteration 37: Bubble Pop - Light Mode -->
<!-- Concept: Fragile bubble at moment of bursting - delicate ephemerality -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Main bubble circle - thin, fragile -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="#000" stroke-width="2"/>

  <!-- Secondary inner reflection circle -->
  <circle cx="85" cy="80" r="15" fill="none" stroke="#000" stroke-width="1.5" opacity="0.4"/>

  <!-- Rupture point - small explosion -->
  <line x1="145" y1="75" x2="155" y2="65" stroke="#000" stroke-width="2.5"/>
  <line x1="148" y1="72" x2="158" y2="72" stroke="#000" stroke-width="2.5"/>
  <line x1="145" y1="78" x2="155" y2="83" stroke="#000" stroke-width="2.5"/>

  <!-- Fragmenting edge near rupture -->
  <path d="M 148 75 A 50 50 0 0 1 145 85" fill="none" stroke="#000" stroke-width="2"
        stroke-dasharray="3 2" opacity="0.6"/>

  <!-- Dispersing mist/spray particles -->
  <circle cx="160" cy="63" r="2" fill="#000" opacity="0.4"/>
  <circle cx="163" cy="70" r="1.5" fill="#000" opacity="0.3"/>
  <circle cx="165" cy="60" r="1.5" fill="#000" opacity="0.3"/>
  <circle cx="158" cy="85" r="2" fill="#000" opacity="0.4"/>
  <circle cx="162" cy="88" r="1" fill="#000" opacity="0.2"/>

  <!-- Smaller particles flying away -->
  <circle cx="168" cy="58" r="1" fill="#000" opacity="0.2"/>
  <circle cx="167" cy="92" r="1" fill="#000" opacity="0.2"/>
  <circle cx="172" cy="75" r="0.8" fill="#000" opacity="0.15"/>
</svg>
