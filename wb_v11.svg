<text x="130" y="125" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">OneTime</text>
<text x="130" y="150" font-size="28" font-weight="300" fill="#fff" text-anchor="middle">Secret</text>
<text x="130" y="175" font-size="14" fill="#fff" text-anchor="middle" opacity=".7">One view. Then gone.</text>
</g>
<text x="5" y="195" font-size="8" fill="#fff" opacity=".4">Document shredding—strips vanishing, unrecoverable.</text>
