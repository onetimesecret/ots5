  <path d="M 120 52 Q 118 80 120 108" fill="none" stroke="#000" stroke-width="4" opacity="0.6"/>
  <path d="M 110 55 Q 109 80 110 105" fill="none" stroke="#000" stroke-width="3" opacity="0.4"/>

